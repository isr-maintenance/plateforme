function wrap(txt,max){const w=txt.split(' ');const L=[''];w.forEach(x=>{if((L[L.length-1]+' '+x).trim().length>max&&L[L.length-1])L.push(x);else L[L.length-1]=(L[L.length-1]+' '+x).trim();});return L;}
window.draw=function(seg,t,data){
  svg.innerHTML='';
  el('rect',{x:0,y:0,width:1280,height:720,fill:C.bg});
  T(svg,60,66,data.chapitre,20,C.muted,{w:600,extra:{'letter-spacing':'2'}});
  T(svg,1220,66,'Ampère & Fils',20,C.muted,{a:'end',w:600});
  const s=data.segments[seg];const A=mk(seg,t);const ph=(t/0.5)%1;
  const FIT=window.FIT;
  const bottom=FIT[s.scene]||565,k=Math.min(1,(575-100)/(bottom-110));
  const g=el('g',{transform:`translate(${640-640*k} ${100-110*k}) scale(${k})`});
  if(SCL[s.scene]){ const first=data.segments.findIndex(x=>x.scene===s.scene); SCL[s.scene](g,(j,at)=>A(j+first,at),ph); } else SC[s.scene](g,A,ph);
  // sous-titre : zone fixe en bas
  let size=28,lines=wrap(s.texte,76);if(lines.length>2){size=26;lines=wrap(s.texte,86);}
  box(svg,70,596,1140,100,'rgba(10,13,19,0.92)','none',18);
  const y0=646-(lines.length-1)*20+9;
  lines.forEach((l,i)=>T(svg,640,y0+i*40,l,size,'#fff',{a:'middle',w:500}));
  return window.maxAt;
};
